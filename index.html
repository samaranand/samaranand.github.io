<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Samar Anand is a Bengaluru-based software engineer working on fintech, backend systems, reliability, and personal infrastructure projects." />
    <link rel="canonical" href="https://samaranand.github.io/" />
    <meta property="og:title" content="Samar Anand — Software Engineer & Builder" />
    <meta property="og:description" content="A personal digital workshop for backend systems, fintech work, home-lab experiments, and notes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samaranand.github.io/" />
    <link rel="icon" href="img/logo.png" type="image/png" />
    <link rel="stylesheet" href="css/main.css?v=2.1.1" />
    <script defer src="js/content.js?v=2.1.1"></script>
    <script defer src="js/app.js?v=2.1.1"></script>
    <title>Samar Anand — Software Engineer & Builder</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header" data-header>
      <nav class="nav shell" aria-label="Primary navigation">
        <a class="wordmark" href="#top" aria-label="Samar Anand, home">SA<span>.</span></a>
        <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="nav-links">
          <span class="sr-only">Toggle navigation</span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="nav-links" data-nav-links>
          <a href="#work">Work</a>
          <a href="#projects">Projects</a>
          <a href="#github">GitHub</a>
          <a href="#experience">Experience</a>
          <a href="#notes">Notes</a>
          <a href="#about">About</a>
          <a href="#contact" class="nav-cta">Contact <span aria-hidden="true">↗</span></a>
        </div>
      </nav>
    </header>
    <main id="main-content">
      <section class="hero shell" id="top" aria-labelledby="hero-heading">
        <div class="hero-grid" aria-hidden="true"></div>
        <p class="eyebrow reveal" data-content="hero.eyebrow"></p>
        <div class="hero-heading-wrap">
          <h1 id="hero-heading" class="reveal" data-content="hero.title"></h1>
          <aside class="hero-side-note reveal" data-content="hero.sideNote"></aside>
        </div>
        <div class="hero-bottom reveal">
          <p class="hero-summary" data-content="hero.summary"></p>
          <a class="button button-primary" href="#projects">Open the projects <span aria-hidden="true">↓</span></a>
        </div>
        <div class="hero-index reveal" aria-hidden="true"><span>01 / 07</span><span>Digital workshop</span></div>
      </section>

      <section class="section shell" id="work" aria-labelledby="work-heading">
        <div class="section-heading reveal">
          <p class="eyebrow" data-content="sections.work.kicker"></p>
          <h2 id="work-heading" data-content="sections.work.title"></h2>
          <p data-content="sections.work.intro"></p>
        </div>
        <div class="case-studies" data-work-list></div>
        <p class="work-note reveal" data-content="sections.work.note"></p>
        <div class="work-index reveal" aria-label="Additional professional work" data-work-index></div>
      </section>

      <span id="workshop" class="anchor-alias" aria-hidden="true"></span>
      <section class="section workshop-section" id="projects" aria-labelledby="workshop-heading">
        <div class="shell">
          <div class="section-heading workshop-heading reveal">
            <p class="eyebrow" data-content="sections.workshop.kicker"></p>
            <h2 id="workshop-heading" data-content="sections.workshop.title"></h2>
            <p data-content="sections.workshop.intro"></p>
          </div>
          <div class="workshop-list" data-workshop-list></div>
          <div class="ideas-shelf reveal" aria-label="Other things I have been building or thinking about">
            <p class="eyebrow">/smaller ideas</p>
            <div class="ideas-list" data-ideas-list></div>
          </div>
        </div>
      </section>

      <section class="section shell github-section" id="github" aria-labelledby="github-heading">
        <div class="github-layout">
          <div class="section-heading reveal">
            <p class="eyebrow" data-content="sections.github.kicker"></p>
            <h2 id="github-heading" data-content="sections.github.title"></h2>
            <p data-content="sections.github.intro"></p>
            <a class="text-link" data-github-profile target="_blank" rel="noopener"></a>
          </div>
          <div class="github-panel reveal">
            <div class="github-stats" data-github-stats></div>
            <div class="github-repos" data-github-repos></div>
          </div>
        </div>
      </section>

      <section class="section shell experience-section" id="experience" aria-labelledby="experience-heading">
        <div class="experience-layout">
          <div class="section-heading reveal">
            <p class="eyebrow" data-content="sections.experience.kicker"></p>
            <h2 id="experience-heading" data-content="sections.experience.title"></h2>
            <p data-content="sections.experience.intro"></p>
          </div>
          <div class="timeline" data-experience-list></div>
        </div>
      </section>

      <section class="section shell notes-section" id="notes" aria-labelledby="notes-heading">
        <div class="notes-layout">
          <div class="section-heading reveal">
            <p class="eyebrow" data-content="sections.notes.kicker"></p>
            <h2 id="notes-heading" data-content="sections.notes.title"></h2>
            <p data-content="sections.notes.intro"></p>
            <a class="text-link" data-notes-link target="_blank" rel="noopener"></a>
          </div>
          <div class="notes-register reveal" data-notes-list></div>
        </div>
      </section>

      <section class="section shell about-section" id="about" aria-labelledby="about-heading">
        <div class="portrait-block reveal">
          <div class="portrait-frame"><img src="img/samar-anand.png" alt="Samar Anand" /></div>
          <p data-content="about.caption"></p>
        </div>
        <div class="about-copy reveal">
          <p class="eyebrow" data-content="sections.about.kicker"></p>
          <h2 id="about-heading" data-content="sections.about.title"></h2>
          <div data-about-copy></div>
        </div>
      </section>

      <section class="section shell current-section" aria-labelledby="current-heading">
        <div class="section-heading reveal">
          <p class="eyebrow" data-content="sections.now.kicker"></p>
          <h2 id="current-heading" data-content="sections.now.title"></h2>
        </div>
        <div class="current-list reveal" data-current-list></div>
      </section>

      <section class="contact-section" id="contact" aria-labelledby="contact-heading">
        <div class="shell contact-inner reveal">
          <p class="eyebrow" data-content="sections.contact.kicker"></p>
          <h2 id="contact-heading" data-content="sections.contact.title"></h2>
          <a class="contact-email" data-contact-email></a>
          <div class="contact-links" data-contact-links></div>
        </div>
      </section>
    </main>
    <footer class="footer shell"><span>© <span data-year></span> Samar Anand</span><span>Built quietly in Bengaluru.</span></footer>
  </body>
</html>
